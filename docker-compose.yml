services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-pipeline-app
    # Every variable in .env is passed through as-is. Optional settings (consumer, retry, relay,
    # recovery) have their defaults in application.yml only; set them in .env to override.
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    container_name: event-pipeline-mongodb
    env_file:
      - .env
    environment:
      # Only the variables the image expects under a different name; the rest come from .env.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - ./mongo/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  localstack:
    image: localstack/localstack:4.14
    container_name: event-pipeline-localstack
    # The init script reads AWS_SQS_QUEUE_NAME, AWS_SQS_DLQ_NAME and PROCESSING_MAX_ATTEMPTS from .env.
    # PROCESSING_MAX_ATTEMPTS MUST equal the main queue maxReceiveCount (both default to 3 when unset).
    env_file:
      - .env
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION}
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
