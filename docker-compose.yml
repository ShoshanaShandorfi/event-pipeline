services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-pipeline-app
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME}
      SERVER_PORT: ${SERVER_PORT}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      AWS_SQS_ENDPOINT: ${AWS_SQS_ENDPOINT}
      AWS_SQS_QUEUE_NAME: ${AWS_SQS_QUEUE_NAME}
      AWS_SQS_DLQ_NAME: ${AWS_SQS_DLQ_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # Consumer settings are non-secret and have application defaults; only overridden
      # when actually present in the environment / .env file.
      AWS_SQS_CONSUMER_ENABLED: ${AWS_SQS_CONSUMER_ENABLED:-true}
      AWS_SQS_CONSUMER_MAX_MESSAGES: ${AWS_SQS_CONSUMER_MAX_MESSAGES:-10}
      AWS_SQS_CONSUMER_WAIT_TIME_SECONDS: ${AWS_SQS_CONSUMER_WAIT_TIME_SECONDS:-20}
      AWS_SQS_CONSUMER_VISIBILITY_TIMEOUT_SECONDS: ${AWS_SQS_CONSUMER_VISIBILITY_TIMEOUT_SECONDS:-30}
      AWS_SQS_CONSUMER_WORKER_THREADS: ${AWS_SQS_CONSUMER_WORKER_THREADS:-4}
      AWS_SQS_CONSUMER_SHUTDOWN_WAIT_SECONDS: ${AWS_SQS_CONSUMER_SHUTDOWN_WAIT_SECONDS:-25}
      # MUST equal main queue maxReceiveCount; LocalStack init receives the same value below.
      PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
      RETRY_BACKOFF_BASE_SECONDS: ${RETRY_BACKOFF_BASE_SECONDS:-5}
      RETRY_BACKOFF_CAP_SECONDS: ${RETRY_BACKOFF_CAP_SECONDS:-60}
      RELAY_ENABLED: ${RELAY_ENABLED:-true}
      RELAY_INTERVAL_SECONDS: ${RELAY_INTERVAL_SECONDS:-10}
      RELAY_STALE_RECEIVED_THRESHOLD_SECONDS: ${RELAY_STALE_RECEIVED_THRESHOLD_SECONDS:-60}
      RELAY_BATCH_SIZE: ${RELAY_BATCH_SIZE:-100}
      RECOVERY_ENABLED: ${RECOVERY_ENABLED:-true}
      RECOVERY_INTERVAL_SECONDS: ${RECOVERY_INTERVAL_SECONDS:-10}
      # Larger than visibility timeout AND maximum expected processing time.
      RECOVERY_STALE_PROCESSING_THRESHOLD_SECONDS: ${RECOVERY_STALE_PROCESSING_THRESHOLD_SECONDS:-300}
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    container_name: event-pipeline-mongodb
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./mongo/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  localstack:
    image: localstack/localstack:4.14
    container_name: event-pipeline-localstack
    env_file:
      - .env
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SQS_QUEUE_NAME: ${AWS_SQS_QUEUE_NAME}
      AWS_SQS_DLQ_NAME: ${AWS_SQS_DLQ_NAME}
      PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
